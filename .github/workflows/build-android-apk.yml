name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  apk:
    runs-on: ubuntu-latest
    # ubuntu-latest runners already have the full Android SDK preinstalled at
    # /usr/local/lib/android/sdk; setting these explicitly avoids the
    # cmdline-tools version mismatch and the license-acceptance hang.
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Capacitor 7 requires JDK 21 (JDK 17 fails the Gradle build).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Build web assets (static SPA)
        run: |
          npm run build:android
          # Find the generated HTML output and guarantee dist/client/index.html
          SRC=""
          for d in dist/client .output/public dist; do
            if [ -f "$d/index.html" ]; then SRC="$d"; break; fi
          done
          if [ -z "$SRC" ]; then
            echo "No index.html found in dist/client, .output/public or dist" >&2
            ls -la dist .output/public 2>/dev/null || true
            exit 1
          fi
          echo "Web output found in: $SRC"
          if [ "$SRC" != "dist/client" ]; then
            mkdir -p dist/client
            cp -R "$SRC"/. dist/client/
          fi
          ls -la dist/client
          test -f dist/client/index.html
      - name: Add Android platform (android/ is generated, not committed)
        run: "[ -d android ] || npx cap add android"
      - name: Sync + patch native project
        run: |
          npx cap sync android
          node scripts/android-intents.cjs
          node scripts/android-native.cjs
          node scripts/android-icons.cjs
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: loma-viewer-apk
          path: android/app/build/outputs/apk/debug/*.apk
